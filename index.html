<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rol ve İl Tabanlı Üye Yönetim Paneli</title>
    <style>
        :root { --primary: #2563eb; --danger: #dc2626; --success: #16a34a; --bg: #f8fafc; --text: #1e293b; --border: #cbd5e1; }
        body { font-family: system-ui, -apple-system, sans-serif; background: var(--bg); color: var(--text); margin: 0; padding: 20px; }
        
        /* Giriş Ekranı */
        #loginContainer { max-width: 400px; margin: 80px auto; background: white; padding: 30px; border-radius: 12px; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1); text-align: center; }
        #loginContainer h2 { margin-top: 0; color: #0f172a; }
        .login-input { width: 100%; padding: 12px; margin-bottom: 15px; font-size: 15px; border: 1px solid var(--border); border-radius: 6px; box-sizing: border-box; outline: none; }
        .login-input:focus { border-color: var(--primary); box-shadow: 0 0 0 3px rgba(37,99,235,0.1); }
        .login-btn { width: 100%; background: var(--primary); color: white; border: none; padding: 12px; font-size: 16px; border-radius: 6px; cursor: pointer; font-weight: 500; }
        .login-btn:hover { background: #1d4ed8; }
        .error-msg { color: #dc2626; font-size: 14px; margin-top: 10px; display: none; }

        /* Ana Panel */
        #appContainer { display: none; max-width: 1200px; margin: 0 auto; background: white; padding: 24px; border-radius: 12px; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1); }
        h2, h3 { margin-top: 0; color: #0f172a; }
        .top-bar { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 10px; margin-bottom: 20px; padding-bottom: 15px; border-bottom: 1px solid #e2e8f0; }
        .role-badge { background: #eff6ff; color: #1d4ed8; border: 1px solid #bfdbfe; padding: 5px 12px; border-radius: 20px; font-size: 13px; font-weight: 600; }

        .form-section { background: #f1f5f9; padding: 20px; border-radius: 8px; margin-bottom: 25px; }
        .form-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 12px; margin-bottom: 14px; }
        .field-group { display: flex; flex-direction: column; gap: 4px; }
        .field-group label { font-size: 12px; font-weight: 600; color: #475569; }
        input, select { padding: 10px 12px; font-size: 14px; border: 1px solid var(--border); border-radius: 6px; outline: none; background: white; }
        input:focus, select:focus { border-color: var(--primary); box-shadow: 0 0 0 3px rgba(37,99,235,0.1); }
        input[readonly] { background: #e2e8f0; color: #475569; cursor: not-allowed; font-weight: 600; }
        button { background: var(--primary); color: white; border: none; padding: 10px 20px; font-size: 14px; border-radius: 6px; cursor: pointer; font-weight: 500; }
        button:hover { opacity: 0.92; }
        button:disabled { opacity: 0.6; cursor: not-allowed; }
        .btn-danger { background: var(--danger); }
        .btn-success { background: var(--success); }
        .btn-secondary { background: #64748b; }

        .filter-bar { display: grid; grid-template-columns: 2fr 1fr 1fr; gap: 12px; margin-bottom: 20px; }

        .table-responsive { overflow-x: auto; }
        table { width: 100%; border-collapse: collapse; text-align: left; margin-top: 10px; }
        th, td { padding: 12px 16px; border-bottom: 1px solid #e2e8f0; font-size: 14px; }
        th { background: #f1f5f9; font-weight: 600; color: #475569; }
        tr:hover { background: #f8fafc; cursor: pointer; }

        .badge { display: inline-block; padding: 4px 8px; font-size: 12px; font-weight: 500; border-radius: 4px; }
        .badge.aktif { background: #dcfce7; color: #166534; }
        .badge.pasif { background: #fee2e2; color: #991b1b; }

        /* Düzenleme / Detay Modal */
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); justify-content: center; align-items: center; z-index: 100; }
        .modal-content { background: white; padding: 24px; border-radius: 8px; width: 100%; max-width: 540px; position: relative; max-height: 90vh; overflow-y: auto; }
        .close-btn { position: absolute; top: 15px; right: 20px; font-size: 22px; cursor: pointer; color: #64748b; }
        .modal-form { display: flex; flex-direction: column; gap: 12px; margin-top: 15px; }
        .modal-actions { display: flex; justify-content: space-between; align-items: center; gap: 10px; margin-top: 20px; padding-top: 15px; border-top: 1px solid #e2e8f0; flex-wrap: wrap; }
        .modal-actions-right { display: flex; gap: 8px; }
    </style>
</head>
<body>

    <!-- 1. GİRİŞ EKRANI -->
    <div id="loginContainer">
        <h2>Sistem Girişi</h2>
        <p style="color: #64748b; font-size: 14px; margin-bottom: 20px;">Kullanıcı adı ve parolanızı giriniz.</p>
        <input type="text" id="kullaniciAdi" class="login-input" placeholder="Kullanıcı Adı">
        <input type="password" id="parola" class="login-input" placeholder="Parola" onkeypress="if(event.key==='Enter') girisYap()">
        <button class="login-btn" id="loginBtn" onclick="girisYap()">Giriş Yap</button>
        <div id="hataKutusu" class="error-msg">Kullanıcı adı veya parola hatalı!</div>
    </div>

    <!-- 2. ANA PANEL -->
    <div id="appContainer">
        <div class="top-bar">
            <div>
                <h2 style="margin-bottom: 4px;">Üye Yönetim Paneli</h2>
                <span id="aktifYetkiBilgisi" class="role-badge"></span>
            </div>
            <button onclick="cikisYap()" class="btn-danger" style="padding: 8px 14px; font-size: 13px;">Güvenli Çıkış</button>
        </div>

        <!-- Dinamik Üye Ekleme Formu -->
        <div class="form-section">
            <h3>Yeni Üye Kaydı Ekle</h3>
            <div class="form-grid" id="dinamikFormAlanlari"></div>
            <button id="kaydetBtn" onclick="uyeEkle()">Üyeyi Buluta Kaydet</button>
        </div>

        <!-- Arama ve Filtreleme -->
        <div class="filter-bar" id="filterBar">
            <input type="text" id="searchInput" placeholder="Tüm alanlarda ara..." onkeyup="filtrele()">
            <select id="ilFilter" onchange="filtrele()">
                <option value="">Tüm İller</option>
            </select>
            <select id="durumFilter" onchange="filtrele()">
                <option value="">Tüm Durumlar</option>
                <option value="Aktif">Aktif</option>
                <option value="Pasif">Pasif</option>
            </select>
        </div>

        <!-- Dinamik Üye Tablosu -->
        <div class="table-responsive">
            <table>
                <thead id="tabloBasliklari"></thead>
                <tbody id="uyeTablosu"></tbody>
            </table>
        </div>
    </div>

    <!-- Üye Düzenleme / Silme Modalı -->
    <div id="detayModal" class="modal">
        <div class="modal-content">
            <span class="close-btn" onclick="modalKapat()">&times;</span>
            <h3 id="modalBaslik">Üye Kaydını Düzenle</h3>
            <div class="modal-form" id="modalFormAlanlari"></div>
            <div class="modal-actions">
                <button type="button" id="silBtn" class="btn-danger" onclick="uyeSil()">Kaydı Sil</button>
                <div class="modal-actions-right">
                    <button type="button" class="btn-secondary" onclick="modalKapat()">Vazgeç</button>
                    <button type="button" id="guncelleBtn" class="btn-success" onclick="uyeGuncelle()">Değişiklikleri Kaydet</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        const BIN_ID = '6afdbb0aac6210605a91ed57';
        const API_KEY = '$2a$10$.8KHMb55.oiyYEpxDTddwexWgMM09tidhGfKwbmnZ6ah4M/0oewWe';
        const URL = `https://api.jsonbin.io/v3/b/${BIN_ID}`;

        let tumVeriler = { alanlar: [], kullanicilar: [], uyeler: [] };
        let aktifKullanici = null;
        let duzenlenenUyeId = null;

        window.onload = async function() {
            const kayitliOturum = sessionStorage.getItem("aktifKullanici");
            if (kayitliOturum) {
                aktifKullanici = JSON.parse(kayitliOturum);
                await verileriCek();
                if (aktifKullanici) paneliHazirla();
            }
        };

        async function verileriCek() {
            try {
                const response = await fetch(URL, { headers: { 'X-Master-Key': API_KEY } });
                const data = await response.json();
                tumVeriler = data.record || { alanlar: [], kullanicilar: [], uyeler: [] };
            } catch (error) {
                console.error('Veri çekme hatası:', error);
                alert('Veritabanına bağlanırken hata oluştu!');
            }
        }

        async function bulutaKaydet() {
            const response = await fetch(URL, {
                method: 'PUT',
                headers: { 'Content-Type': 'application/json', 'X-Master-Key': API_KEY },
                body: JSON.stringify(tumVeriler)
            });
            return response.ok;
        }

        async function girisYap() {
            const kadi = document.getElementById('kullaniciAdi').value.trim();
            const parola = document.getElementById('parola').value.trim();
            const hataKutusu = document.getElementById('hataKutusu');
            const btn = document.getElementById('loginBtn');

            btn.textContent = "Kontrol ediliyor...";
            btn.disabled = true;
            hataKutusu.style.display = "none";

            await verileriCek();

            const bulunan = (tumVeriler.kullanicilar || []).find(k => k.kadi === kadi && k.parola === parola);
            btn.textContent = "Giriş Yap";
            btn.disabled = false;

            if (bulunan) {
                aktifKullanici = bulunan;
                sessionStorage.setItem("aktifKullanici", JSON.stringify(bulunan));
                paneliHazirla();
            } else {
                hataKutusu.style.display = "block";
            }
        }

        function cikisYap() {
            sessionStorage.removeItem("aktifKullanici");
            location.reload();
        }

        function paneliHazirla() {
            document.getElementById('loginContainer').style.display = 'none';
            document.getElementById('appContainer').style.display = 'block';

            const yetkiSpan = document.getElementById('aktifYetkiBilgisi');
            const ilFilter = document.getElementById('ilFilter');

            if (aktifKullanici.rol === 'admin') {
                yetkiSpan.textContent = `Kullanıcı: ${aktifKullanici.kadi} | Yetki: Tam Yönetici (Tüm İller)`;
                ilFilter.style.display = 'block';
                ilFiltresiniDoldur();
            } else {
                yetkiSpan.textContent = `Kullanıcı: ${aktifKullanici.kadi} | Yetkili İl: ${aktifKullanici.il}`;
                ilFilter.style.display = 'none';
            }

            formuOlustur();
            tabloBasliklariniOlustur();
            filtrele();
        }

        function formuOlustur() {
            const container = document.getElementById('dinamikFormAlanlari');
            container.innerHTML = '';

            tumVeriler.alanlar.forEach(alan => {
                const div = document.createElement('div');
                div.className = 'field-group';

                const label = document.createElement('label');
                label.textContent = alan.label + (alan.key === 'ad' || alan.key === 'il' ? ' *' : '');

                const input = document.createElement('input');
                input.type = alan.type || 'text';
                input.id = `field_${alan.key}`;
                input.placeholder = alan.label;

                if (alan.key === 'il' && aktifKullanici.rol !== 'admin') {
                    input.value = aktifKullanici.il;
                    input.readOnly = true;
                }

                div.appendChild(label);
                div.appendChild(input);
                container.appendChild(div);
            });

            const durumDiv = document.createElement('div');
            durumDiv.className = 'field-group';
            durumDiv.innerHTML = `
                <label>Durum</label>
                <select id="field_durum">
                    <option value="Aktif">Aktif</option>
                    <option value="Pasif">Pasif</option>
                </select>
            `;
            container.appendChild(durumDiv);
        }

        function tabloBasliklariniOlustur() {
            const thead = document.getElementById('tabloBasliklari');
            const gorunurAlanlar = tumVeriler.alanlar.filter(a => a.showInTable);
            
            let html = '<tr>';
            gorunurAlanlar.forEach(alan => {
                html += `<th>${alan.label}</th>`;
            });
            html += '<th>Durum</th></tr>';
            thead.innerHTML = html;
        }

        function ilFiltresiniDoldur() {
            const ilFilter = document.getElementById('ilFilter');
            const mevcutSecim = ilFilter.value;
            const iller = [...new Set((tumVeriler.uyeler || []).map(u => u.il).filter(Boolean))].sort();
            ilFilter.innerHTML = '<option value="">Tüm İller</option>';
            iller.forEach(il => {
                ilFilter.innerHTML += `<option value="${il}">${il}</option>`;
            });
            if (iller.includes(mevcutSecim)) ilFilter.value = mevcutSecim;
        }

        function yetkiliUyeleriGetir() {
            const tumUyeler = tumVeriler.uyeler || [];
            if (aktifKullanici.rol === 'admin') {
                return tumUyeler;
            }
            return tumUyeler.filter(u => (u.il || '').toLocaleLowerCase('tr-TR') === aktifKullanici.il.toLocaleLowerCase('tr-TR'));
        }

        function filtrele() {
            const arama = document.getElementById('searchInput').value.toLocaleLowerCase('tr-TR');
            const secilenIl = aktifKullanici.rol === 'admin' ? document.getElementById('ilFilter').value : aktifKullanici.il;
            const secilenDurum = document.getElementById('durumFilter').value;

            const bazListe = yetkiliUyeleriGetir();

            const filtrelenmis = bazListe.filter(uye => {
                const metinUyuyor = arama === '' || tumVeriler.alanlar.some(alan => {
                    const deger = String(uye[alan.key] || '').toLocaleLowerCase('tr-TR');
                    return deger.includes(arama);
                });

                const ilUyuyor = secilenIl === '' || (uye.il || '').toLocaleLowerCase('tr-TR') === secilenIl.toLocaleLowerCase('tr-TR');
                const durumUyuyor = secilenDurum === '' || uye.durum === secilenDurum;

                return metinUyuyor && ilUyuyor && durumUyuyor;
            });

            tabloyuGoster(filtrelenmis);
        }

        function tabloyuGoster(liste) {
            const tbody = document.getElementById('uyeTablosu');
            const gorunurAlanlar = tumVeriler.alanlar.filter(a => a.showInTable);
            tbody.innerHTML = '';

            if (liste.length === 0) {
                tbody.innerHTML = `<tr><td colspan="${gorunurAlanlar.length + 1}" style="text-align:center; color:#94a3b8;">Kayıt bulunamadı.</td></tr>`;
                return;
            }

            liste.forEach(uye => {
                const tr = document.createElement('tr');
                tr.onclick = () => detayVeDuzenleAc(uye);
                
                let cells = '';
                gorunurAlanlar.forEach((alan, idx) => {
                    const val = uye[alan.key] || '-';
                    cells += idx === 0 ? `<td><strong>${val}</strong></td>` : `<td>${val}</td>`;
                });
                const durum = uye.durum || 'Aktif';
                cells += `<td><span class="badge ${durum.toLowerCase()}">${durum}</span></td>`;
                
                tr.innerHTML = cells;
                tbody.appendChild(tr);
            });
        }

        async function uyeEkle() {
            const adInput = document.getElementById('field_ad');
            if (!adInput || !adInput.value.trim()) {
                alert('Lütfen Ad Soyad alanını doldurun!');
                return;
            }

            const btn = document.getElementById('kaydetBtn');
            btn.disabled = true;
            btn.textContent = "Kaydediliyor...";

            const yeniUye = {
                id: Date.now(),
                durum: document.getElementById('field_durum').value,
                tarih: new Date().toISOString().split('T')[0]
            };

            tumVeriler.alanlar.forEach(alan => {
                const el = document.getElementById(`field_${alan.key}`);
                yeniUye[alan.key] = el ? el.value.trim() : '';
            });

            if (aktifKullanici.rol !== 'admin') {
                yeniUye.il = aktifKullanici.il;
            } else if (!yeniUye.il) {
                alert('Lütfen İl alanını doldurun!');
                btn.disabled = false;
                btn.textContent = "Üyeyi Buluta Kaydet";
                return;
            }

            if (!tumVeriler.uyeler) tumVeriler.uyeler = [];
            tumVeriler.uyeler.push(yeniUye);

            try {
                const ok = await bulutaKaydet();
                if (ok) {
                    tumVeriler.alanlar.forEach(alan => {
                        if (!(alan.key === 'il' && aktifKullanici.rol !== 'admin')) {
                            const el = document.getElementById(`field_${alan.key}`);
                            if (el) el.value = '';
                        }
                    });
                    if (aktifKullanici.rol === 'admin') ilFiltresiniDoldur();
                    filtrele();
                    alert('Üye kaydı buluta eklendi!');
                } else {
                    tumVeriler.uyeler.pop();
                    alert('Kayıt sırasında bulut hatası oluştu!');
                }
            } catch (error) {
                tumVeriler.uyeler.pop();
                console.error('Kayıt hatası:', error);
                alert('Bağlantı hatası!');
            } finally {
                btn.disabled = false;
                btn.textContent = "Üyeyi Buluta Kaydet";
            }
        }

        function detayVeDuzenleAc(uye) {
            if (aktifKullanici.rol !== 'admin' && (uye.il || '').toLocaleLowerCase('tr-TR') !== aktifKullanici.il.toLocaleLowerCase('tr-TR')) {
                alert('Bu ildeki kayda erişim yetkiniz yok.');
                return;
            }

            duzenlenenUyeId = uye.id;
            document.getElementById('modalBaslik').textContent = `${uye.ad || 'Üye'} - Düzenle`;

            const formDiv = document.getElementById('modalFormAlanlari');
            formDiv.innerHTML = '';

            tumVeriler.alanlar.forEach(alan => {
                const group = document.createElement('div');
                group.className = 'field-group';

                const label = document.createElement('label');
                label.textContent = alan.label;

                const input = document.createElement('input');
                input.type = alan.type || 'text';
                input.id = `edit_${alan.key}`;
                input.value = uye[alan.key] || '';

                if (alan.key === 'il' && aktifKullanici.rol !== 'admin') {
                    input.value = aktifKullanici.il;
                    input.readOnly = true;
                }

                group.appendChild(label);
                group.appendChild(input);
                formDiv.appendChild(group);
            });

            const durumGroup = document.createElement('div');
            durumGroup.className = 'field-group';
            durumGroup.innerHTML = `
                <label>Durum</label>
                <select id="edit_durum">
                    <option value="Aktif" ${(uye.durum || 'Aktif') === 'Aktif' ? 'selected' : ''}>Aktif</option>
                    <option value="Pasif" ${uye.durum === 'Pasif' ? 'selected' : ''}>Pasif</option>
                </select>
            `;
            formDiv.appendChild(durumGroup);

            const tarihGroup = document.createElement('div');
            tarihGroup.className = 'field-group';
            tarihGroup.innerHTML = `
                <label>Kayıt Tarihi</label>
                <input type="text" value="${uye.tarih || '-'}" readonly>
            `;
            formDiv.appendChild(tarihGroup);

            document.getElementById('detayModal').style.display = 'flex';
        }

        async function uyeGuncelle() {
            const index = (tumVeriler.uyeler || []).findIndex(u => u.id === duzenlenenUyeId);
            if (index === -1) return;

            const mevcutUye = tumVeriler.uyeler[index];
            if (aktifKullanici.rol !== 'admin' && (mevcutUye.il || '').toLocaleLowerCase('tr-TR') !== aktifKullanici.il.toLocaleLowerCase('tr-TR')) {
                alert('Yetkisiz işlem!');
                return;
            }

            const adVal = (document.getElementById('edit_ad')?.value || '').trim();
            if (!adVal) {
                alert('Ad Soyad boş bırakılamaz!');
                return;
            }

            const yedek = { ...mevcutUye };
            const guncelUye = { ...mevcutUye, durum: document.getElementById('edit_durum').value };

            tumVeriler.alanlar.forEach(alan => {
                const el = document.getElementById(`edit_${alan.key}`);
                if (el) guncelUye[alan.key] = el.value.trim();
            });

            if (aktifKullanici.rol !== 'admin') {
                guncelUye.il = aktifKullanici.il;
            } else if (!guncelUye.il) {
                alert('İl alanı boş bırakılamaz!');
                return;
            }

            const btn = document.getElementById('guncelleBtn');
            btn.disabled = true;
            btn.textContent = "Kaydediliyor...";

            tumVeriler.uyeler[index] = guncelUye;

            try {
                const ok = await bulutaKaydet();
                if (ok) {
                    if (aktifKullanici.rol === 'admin') ilFiltresiniDoldur();
                    filtrele();
                    modalKapat();
                    alert('Üye bilgileri güncellendi.');
                } else {
                    tumVeriler.uyeler[index] = yedek;
                    alert('Güncelleme sırasında bulut hatası oluştu!');
                }
            } catch (error) {
                tumVeriler.uyeler[index] = yedek;
                console.error('Güncelleme hatası:', error);
                alert('Bağlantı hatası!');
            } finally {
                btn.disabled = false;
                btn.textContent = "Değişiklikleri Kaydet";
            }
        }

        async function uyeSil() {
            const index = (tumVeriler.uyeler || []).findIndex(u => u.id === duzenlenenUyeId);
            if (index === -1) return;

            const mevcutUye = tumVeriler.uyeler[index];
            if (aktifKullanici.rol !== 'admin' && (mevcutUye.il || '').toLocaleLowerCase('tr-TR') !== aktifKullanici.il.toLocaleLowerCase('tr-TR')) {
                alert('Yetkisiz işlem!');
                return;
            }

            if (!confirm(`"${mevcutUye.ad || 'Bu üye'}" kaydını kalıcı olarak silmek istediğinize emin misiniz?`)) {
                return;
            }

            const btn = document.getElementById('silBtn');
            btn.disabled = true;
            btn.textContent = "Siliniyor...";

            const yedekListe = [...tumVeriler.uyeler];
            tumVeriler.uyeler.splice(index, 1);

            try {
                const ok = await bulutaKaydet();
                if (ok) {
                    if (aktifKullanici.rol === 'admin') ilFiltresiniDoldur();
                    filtrele();
                    modalKapat();
                    alert('Üye kaydı silindi.');
                } else {
                    tumVeriler.uyeler = yedekListe;
                    alert('Silme sırasında bulut hatası oluştu!');
                }
            } catch (error) {
                tumVeriler.uyeler = yedekListe;
                console.error('Silme hatası:', error);
                alert('Bağlantı hatası!');
            } finally {
                btn.disabled = false;
                btn.textContent = "Kaydı Sil";
            }
        }

        function modalKapat() {
            document.getElementById('detayModal').style.display = 'none';
            duzenlenenUyeId = null;
        }
    </script>
</body>
</html>
